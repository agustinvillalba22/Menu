    <script>
      // Safeguard for window.fetch in environments where it only exposes a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Window.prototype;
            var originalProtoFetch = window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() {
                return originalProtoFetch;
              },
              set: function(fn) {
                originalProtoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
