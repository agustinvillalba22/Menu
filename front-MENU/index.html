    <script>
      (function() {
        try {
          let _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = window;
            while (proto) {
              var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (desc && desc.configurable) {
                var cur = desc.get ? desc.get.call(window) : desc.value;
                Object.defineProperty(proto, 'fetch', {
                  get: function() { return cur; },
                  set: function(v) { cur = v; },
                  configurable: true,
                  enumerable: true
                });
                break;
              }
              proto = Object.getPrototypeOf(proto);
            }
          } catch (err) {}
        }
      })();
    </script>

    <div id="root"></div>
